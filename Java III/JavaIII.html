<JavaIII>
<html lang="sq">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulari</title>
    </head>

    <body>

    <h1>Formulari i Plotesimit</h1>

    <form action="forma.html" method="get">
        
        <!-- Fushat tuaja -->
            <p>
            <label for="emri">Emri:</label> <br>
            <input type="text" id="emri" name="emri" required>
            </p>
            <p>
                <label for="email"> Email: </label><br>
                <input type="email" id="email" name="email" required>
            </p>
            <p>
                <label for="shuma e synuar"> Shuma e synuar </label><br>
                <input type="number" id="number" name="number" required min="1" step="1"> 
            </p>

            <p>
                <label for="Afati i kursimit"> Afati i kursimit: </label><br>
                <select id="Afati i kursimit" name="Afati i kursimit" required>
                <option value=""> </option>
                <option value="1 muaj">1 muaj</option>
                <option value="3 muaj">3 muaj</option>
                <option value="6 muaj">6 muaj</option>
                </select>
            </p>
            <p>
                <label for="Shenim shtes"> Shenim shtese </label><br>
                <textarea id="Shenim shtese" name="Shenim shtese" rows="2" cols="30" optional></textarea> 
            </p>
            <p>
                <label for="Deshiroj kujdes"> Deshiroj kujdes:</label><br>
                <input type="checkbox" id="Deshiroj kujdes" name="Deshiroj kujdes" optional> 
            </p>
             <p>
                <label for="Provo dergim"> Provo dergim</label><br>
                <button type="Nis dergimin" id="Provo dergim" name="Provo dergim" > Nis dergimin

            </p>
                
        
    
</body>
</html>
</JavaIII>
